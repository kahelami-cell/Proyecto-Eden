<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Eden - Área de Piscina</title>
    
    <!-- Importando fuentes elegantes desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* Reseteo básico de márgenes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #EEF5F9;
        }

        /* Contenedor principal: utiliza Flexbox para dividir la pantalla */
        .split-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* --- MITAD IZQUIERDA: Área de texto --- */
        .text-side {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #EEF5F9; 
            position: relative;
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: 4px;
            font-size: 0.85rem;
            color: #2B7A9F; 
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .title {
            font-family: 'Cinzel', serif;
            font-size: 4.5rem;
            color: #0F304B; 
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .divider {
            width: 100px;
            height: 4px;
            background-color: #00A8E8; 
            border: none;
            border-radius: 2px;
        }

        /* --- MITAD DERECHA: Área de la imagen --- */
        .image-side {
            width: 50%;
            background-image: url('hotel.png');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* --- ELEMENTOS DE LAS ESQUINAS --- */
        
        .logo-container {
            position: absolute;
            top: 40px;
            left: 50px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background-color: white;
            box-shadow: 0 4px 15px rgba(0, 168, 232, 0.15); 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            z-index: 10;
        }

        .logo-container img {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        /* --- NUEVO: CONTENEDOR DEL MENÚ --- */
        /* Ahora el contenedor tiene la posición absoluta en la esquina superior derecha */
        #nav-container {
            position: absolute;
            top: 40px;
            right: 50px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: flex-end; /* Alinea los elementos a la derecha */
        }

        /* Botón de menú (Se ajustó para heredar la posición de su contenedor) */
        .menu-btn {
            background: rgba(15, 48, 75, 0.5);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 12px 28px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            color: #0F304B;
            border-color: transparent;
        }

        /* --- NUEVO: ESTILOS DEL MENÚ DESPLEGABLE --- */
        .dropdown-menu {
            list-style: none;
            background: white;
            margin-top: 10px; /* Separación entre el botón y la caja */
            width: 100%;
            min-width: 220px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border-radius: 4px;
            overflow: hidden;
            
            /* Oculto por defecto con una animación suave */
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        /* Esta clase es la que JavaScript añade para mostrar el menú */
        .dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu li {
            border-bottom: 1px solid #EEF5F9;
        }

        .dropdown-menu li:last-child {
            border-bottom: none; /* Quita la línea del último elemento */
        }

        .dropdown-menu a {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: #0F304B;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .dropdown-menu a:hover {
            background: #EEF5F9;
            color: #00A8E8;
        }
    </style>
</head>
<body>

    <div class="split-layout">
        
        <!-- Lado Izquierdo (Texto y Logo) -->
        <section class="text-side">
            <div class="logo-container">
                <img src="logo.png" alt="Logo Hotel Eden">
            </div>

            <p class="subtitle">Área de Piscina</p>
            <h1 class="title">HOTEL<br>EDEN</h1>
            <hr class="divider">
        </section>

        <!-- Lado Derecho (Imagen y Menú) -->
        <section class="image-side">
            <!-- Contenedor del menú para agrupar botón y lista -->
            <div id="nav-container">
                <button class="menu-btn" id="menuToggleBtn">MENÚ DE NAVEGACIÓN</button>

                <!-- Menú desplegable -->
                <ul class="dropdown-menu" id="dropdownNav">
                    <li><a href="#">Piscinas.html</a></li>
                    <li><a href="#">AreasRecreativas.html</a></li>
                    <li><a href="#">Calendario.hrml</a></li>
                    <li><a href="#">Clubes.html</a></li>
                    <li><a href="#">SobreNosotros.html</a></li>
                </ul>
            </div>
        </section>

    </div>

    <!-- Script de JavaScript para la funcionalidad -->
    <script>
        const menuToggleBtn = document.getElementById('menuToggleBtn');
        const dropdownNav = document.getElementById('dropdownNav');

        // Abrir/cerrar menú al hacer clic en el botón
        menuToggleBtn.addEventListener('click', function(event) {
            dropdownNav.classList.toggle('active');
            event.stopPropagation(); // Evita que el clic cierre el menú inmediatamente
        });

        // Cerrar el menú si se hace clic en cualquier otro lado de la página
        window.addEventListener('click', function(event) {
            if (!dropdownNav.contains(event.target)) {
                dropdownNav.classList.remove('active');
            }
        });
    </script>
</body>
</html>
