<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calendario - Hotel Eden</title>
    <style>
        /* --- 1. ESTILOS BASE Y HERO (Inspirado en tus otras páginas) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        
        body {
            background-color: #f4f4f4; /* Fondo gris claro para que resalte el calendario */
            display: block; /* Cambiado de flex a block para no romper el Hero */
        }

        .hero { 
            width: 100%; 
            height: 60vh; 
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.3)), 
                        url('calendariofoto.png') center/cover;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            color: white;
            position: relative;
        }

        header { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between; 
            padding: 20px 50px; 
            align-items: center; 
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); 
            z-index: 10;
        }

        .logo img { height: 80px; width: auto; }

        nav ul { display: flex; list-style: none; gap: 25px; }
        nav ul li a { 
            color: white; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 13px; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .info-box { 
            text-align: center;
            border: 2px solid rgba(255,255,255,0.3); 
            padding: 30px 50px; 
            background: rgba(0,0,0,0.2); 
            backdrop-filter: blur(3px);
        }

        .info-box h1 { font-size: 50px; letter-spacing: 8px; text-transform: uppercase; }

        /* --- 2. CONTENEDOR PARA EL CALENDARIO --- */
        .seccion-calendario {
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }

        /* --- 3. ESTILOS DEL CALENDARIO (Tu código original intacto) --- */
        .calendario {
            width: 400px; /* Un poco más ancho para mejor visualización */
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .cabecera {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            padding: 20px;
        }

        .cabecera button {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .cabecera button:hover { transform: scale(1.2); }

        .dias-semana {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: bold;
            background-color: #ecf0f1;
            padding: 10px 0;
            color: #7f8c8d;
            font-size: 14px;
        }

        .dias-cuadricula {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 15px;
            gap: 8px;
        }

        .dias-cuadricula div {
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 14px;
        }

        .dias-cuadricula div:hover:not(.vacio) { background-color: #349dbd; color: white; }
        .dias-cuadricula .vacio { cursor: default; }
        .dias-cuadricula .seleccionado { background-color: #e74c3c; color: white; font-weight: bold; }

    </style>
</head>
<body>

    <div class="hero">
        <header>
            <div class="logo">
                <img src="logo.png" alt="Logo Hotel Eden">
            </div>
            <nav>
                <ul>
                    <li><a href="Pagina Web primer prototipo.html">INICIO</a></li>
                    <li><a href="Piscinas.html">PISCINAS</a></li>
                    <li><a href="AreasRecreativas.html">AREAS RECREATIVAS</a></li>
                    <li><a href="Clubes.html">CLUBES</a></li>
                    <li><a href="SobreNosotros.html">SOBRE NOSOTROS</a></li>
                </ul>
            </nav>
        </header>

        <div class="info-box">
            <p style="letter-spacing: 5px; margin-bottom: 10px;">ORGANIZACIÓN • EVENTOS</p>
            <h1>CALENDARIO</h1>
        </div>
    </div>

    <div class="seccion-calendario">
        <div class="calendario">
            <div class="cabecera">
                <button id="btn-anterior">&#10094;</button>
                <h3 id="mes-anio" style="margin: 0;"></h3>
                <button id="btn-siguiente">&#10095;</button>
            </div>

            <div class="dias-semana">
                <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
            </div>

            <div class="dias-cuadricula" id="cuadricula-dias">
                </div>
        </div>
    </div>

    <script>
        const textoMesAnio = document.getElementById('mes-anio');
        const cuadriculaDias = document.getElementById('cuadricula-dias');
        const btnAnterior = document.getElementById('btn-anterior');
        const btnSiguiente = document.getElementById('btn-siguiente');

        const meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        let fechaActual = new Date();
        let diaSeleccionado = null;

        function renderizarCalendario() {
            cuadriculaDias.innerHTML = "";
            const anio = fechaActual.getFullYear();
            const mes = fechaActual.getMonth();

            textoMesAnio.textContent = `${meses[mes]} ${anio}`;

            const primerDiaMes = new Date(anio, mes, 1).getDay();
            const diasEnMes = new Date(anio, mes + 1, 0).getDate();

            for (let i = 0; i < primerDiaMes; i++) {
                const espacioVacio = document.createElement('div');
                espacioVacio.classList.add('vacio');
                cuadriculaDias.appendChild(espacioVacio);
            }

            for (let dia = 1; dia <= diasEnMes; dia++) {
                const elementoDia = document.createElement('div');
                elementoDia.textContent = dia;

                if (diaSeleccionado && 
                    diaSeleccionado.getDate() === dia && 
                    diaSeleccionado.getMonth() === mes && 
                    diaSeleccionado.getFullYear() === anio) {
                    elementoDia.classList.add('seleccionado');
                }

                elementoDia.addEventListener('click', () => {
                    diaSeleccionado = new Date(anio, mes, dia);
                    renderizarCalendario();
                    alert(`Has seleccionado el ${dia} de ${meses[mes]} de ${anio}`);
                });

                cuadriculaDias.appendChild(elementoDia);
            }
        }

        btnAnterior.addEventListener('click', () => {
            fechaActual.setMonth(fechaActual.getMonth() - 1);
            renderizarCalendario();
        });

        btnSiguiente.addEventListener('click', () => {
            fechaActual.setMonth(fechaActual.getMonth() + 1);
            renderizarCalendario();
        });

        renderizarCalendario();
    </script>
</body>
</html>
